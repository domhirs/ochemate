services:
  dartboard:
    build: .
    image: dartboard:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - dartboard-data:/data

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    mem_reservation: 64m
    pids_limit: 100
    cpus: "0.5"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dartboard-data:
